services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 5434 on the host to avoid clashing with a locally installed PostgreSQL.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 3s
      retries: 12

  etl:
    build: ./etl
    env_file: .env
    environment:
      DATABASE_URL: postgres://geo:geo@db:5432/geo
      USGS_DAYS: ${USGS_DAYS:-30}
      USGS_MIN_MAG: ${USGS_MIN_MAG:-2.5}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgres://geo:geo@db:5432/geo
      PORT: 4000
      USGS_POLL_INTERVAL_MIN: ${USGS_POLL_INTERVAL_MIN:-5}
      USGS_MIN_MAG: ${USGS_MIN_MAG:-2.5}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      args:
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  db_data:
